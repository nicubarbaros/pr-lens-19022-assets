name: Decode PNGs
on:
  push:
    paths:
      - 'before.b64'
      - 'after.b64'
      - '.github/workflows/decode-png.yml'
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit PNGs
        run: |
          set -euo pipefail
          base64 -d before.b64 > before.png
          base64 -d after.b64 > after.png
          file before.png after.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add before.png after.png
          if git diff --cached --quiet; then
            echo "PNGs unchanged"
            exit 0
          fi
          git commit -m "Add rendered architecture PNGs"
          git push
